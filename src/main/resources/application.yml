spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/smoke_db?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss

huawei:
  iot:
    ak: ${HUAWEI_IOT_AK}
    sk: ${HUAWEI_IOT_SK}
    regionId: ${HUAWEI_IOT_REGION:cn-north-4}
    endpoint: ${HUAWEI_IOT_ENDPOINT}
    deviceId: ${HUAWEI_IOT_DEVICE_ID}
    projectId: ${HUAWEI_IOT_PROJECT_ID}

server:
  port: ${SERVER_PORT:8080}
  address: ${SERVER_ADDRESS:0.0.0.0}

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:86400000}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
