<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>智慧烟感 · 登录</title>
    <link rel="stylesheet" href="/css/v5.css">
</head>
<body>
<div class="noise"></div>

<main class="login-shell">
    <section class="login-panel reveal">
        <div class="login-wrap">
            <div class="brand-mark" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none">
                    <path d="M12 2c2 3 4.2 5.2 4.2 8.1A4.2 4.2 0 0 1 12 14.3a4.2 4.2 0 0 1-4.2-4.2C7.8 7.4 9.5 5 12 2Z" stroke="currentColor" stroke-width="1.7"/>
                    <path d="M12 12c1.7 1.7 2.6 3.2 2.6 4.7A2.6 2.6 0 0 1 12 19.3a2.6 2.6 0 0 1-2.6-2.6c0-1.4.9-3 2.6-4.7Z" fill="currentColor"/>
                </svg>
            </div>

            <div class="small-caps">SMART SMOKE · EDGE + CLOUD</div>
            <h1 class="login-title">安全，应该<br>安静地发生。</h1>
            <p class="login-sub">边缘快速判断、云端动态误报抑制与设备健康监测，为每个房间提供持续、克制而可靠的烟雾安全守护。</p>

            <div class="segment">
                <button id="loginTab" class="on" type="button">登录</button>
                <button id="registerTab" type="button">居民注册</button>
            </div>

            <form id="loginForm" class="form-view active">
                <div class="field">
                    <label for="loginUsername">账号</label>
                    <input id="loginUsername" class="input" autocomplete="username" placeholder="请输入用户名" required>
                </div>

                <div class="field">
                    <label for="loginPassword">密码</label>
                    <input id="loginPassword" class="input" type="password" autocomplete="current-password" placeholder="请输入密码" required>
                </div>

                <label class="checkline">
                    <input id="rememberUsername" type="checkbox" checked>
                    记住账号 <span style="color:#5e6672">· 不保存密码</span>
                </label>

                <button id="loginButton" class="primary" type="submit">进入智慧烟感</button>
                <div id="loginMessage" class="form-message"></div>
            </form>

            <form id="registerForm" class="form-view">
                <div class="field">
                    <label for="registerUsername">用户名</label>
                    <input id="registerUsername" class="input" placeholder="3-32 个字符" required>
                </div>

                <div class="field">
                    <label for="registerPhone">手机号</label>
                    <input id="registerPhone" class="input" type="tel" placeholder="请输入手机号" required>
                </div>

                <div class="form-grid">
                    <div class="field">
                        <label for="registerBuilding">楼栋</label>
                        <input id="registerBuilding" class="input" type="number" min="1" placeholder="楼栋" required>
                    </div>
                    <div class="field">
                        <label for="registerFloor">楼层</label>
                        <input id="registerFloor" class="input" type="number" min="1" placeholder="楼层" required>
                    </div>
                    <div class="field">
                        <label for="registerRoom">房间</label>
                        <input id="registerRoom" class="input" type="number" min="1" placeholder="房间" required>
                    </div>
                </div>

                <div class="field">
                    <label for="registerPassword">密码</label>
                    <input id="registerPassword" class="input" type="password" autocomplete="new-password" placeholder="至少 6 个字符" required>
                </div>

                <div class="field">
                    <label for="registerPasswordAgain">确认密码</label>
                    <input id="registerPasswordAgain" class="input" type="password" autocomplete="new-password" placeholder="再次输入密码" required>
                </div>

                <button id="registerButton" class="primary" type="submit">创建居民账号</button>
                <div id="registerMessage" class="form-message"></div>
            </form>
        </div>
    </section>

    <section class="visual-panel reveal" data-delay="120">
        <div class="aurora a"></div>
        <div class="aurora b"></div>
        <div class="aurora c"></div>
        <div class="visual-grid"></div>

        <div class="orbit-wrap">
            <div class="orbit"><i class="dot d1"></i><i class="dot d2"></i><i class="dot d3"></i></div>
            <div class="orbit-secondary"></div>
            <div class="device-core">
                <strong>20.0</strong>
                <small>ppm · live</small>
            </div>
        </div>

        <div class="visual-copy">
            <div class="small-caps" style="color:rgba(198,218,239,.32)">Always aware. Never intrusive.</div>
            <h2>实时感知，<br>只在必要时提醒。</h2>
            <p>从 BearPi 边缘判断，到云端动态策略，再到管理员远程控制。端与云保持协同，而真实危险状态始终拥有最高优先级。</p>
        </div>
    </section>
</main>

<script src="/js/auth.js"></script>
<script src="/js/v5-motion.js"></script>
<script>
    SmokeAuth.clearSession();

    const loginTab = document.getElementById('loginTab');
    const registerTab = document.getElementById('registerTab');
    const loginForm = document.getElementById('loginForm');
    const registerForm = document.getElementById('registerForm');

    function setMode(mode) {
        const login = mode === 'login';
        loginTab.classList.toggle('on', login);
        registerTab.classList.toggle('on', !login);
        loginForm.classList.toggle('active', login);
        registerForm.classList.toggle('active', !login);
        if (login) {
            document.getElementById('loginPassword').focus();
        } else {
            document.getElementById('registerUsername').focus();
        }
    }

    loginTab.addEventListener('click', () => setMode('login'));
    registerTab.addEventListener('click', () => setMode('register'));

    const savedUsername = localStorage.getItem(SmokeAuth.SAVED_USERNAME_KEY);
    if (savedUsername) {
        document.getElementById('loginUsername').value = savedUsername;
        document.getElementById('loginPassword').focus();
    } else {
        document.getElementById('loginUsername').focus();
    }

    function setMessage(id, text, type = '') {
        const el = document.getElementById(id);
        el.textContent = text || '';
        el.className = `form-message ${type}`;
    }

    async function parseError(response, fallback) {
        try {
            const data = await response.json();
            return data?.message || fallback;
        } catch (e) {
            return fallback;
        }
    }

    loginForm.addEventListener('submit', async event => {
        event.preventDefault();

        const username = document.getElementById('loginUsername').value.trim();
        const password = document.getElementById('loginPassword').value;
        const remember = document.getElementById('rememberUsername').checked;
        const button = document.getElementById('loginButton');

        setMessage('loginMessage', '');
        button.disabled = true;
        button.textContent = '正在验证身份…';

        try {
            const response = await fetch('/api/auth/login', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({username, password})
            });

            if (!response.ok) {
                throw new Error(await parseError(response, '用户名或密码错误'));
            }

            const loginData = await response.json();
            if (!loginData?.token) throw new Error('服务器未返回登录凭证');

            sessionStorage.setItem(SmokeAuth.TOKEN_KEY, loginData.token);

            const userResponse = await fetch('/api/auth/me');
            if (!userResponse.ok) throw new Error('获取用户身份失败');

            const user = await userResponse.json();
            SmokeAuth.saveLogin(loginData.token, user);

            if (remember) {
                localStorage.setItem(SmokeAuth.SAVED_USERNAME_KEY, username);
            } else {
                localStorage.removeItem(SmokeAuth.SAVED_USERNAME_KEY);
            }

            document.getElementById('loginPassword').value = '';
            setMessage('loginMessage', '登录成功，正在进入系统…', 'success');

            window.setTimeout(() => {
                window.location.replace(user.role === 'admin' ? '/admin.html' : '/index.html');
            }, 320);
        } catch (error) {
            SmokeAuth.clearSession();
            setMessage('loginMessage', error.message || '登录失败', 'error');
            button.disabled = false;
            button.textContent = '进入智慧烟感';
        }
    });

    registerForm.addEventListener('submit', async event => {
        event.preventDefault();

        const username = document.getElementById('registerUsername').value.trim();
        const phone = document.getElementById('registerPhone').value.trim();
        const building = Number(document.getElementById('registerBuilding').value);
        const floor = Number(document.getElementById('registerFloor').value);
        const room = Number(document.getElementById('registerRoom').value);
        const password = document.getElementById('registerPassword').value;
        const passwordAgain = document.getElementById('registerPasswordAgain').value;
        const button = document.getElementById('registerButton');

        setMessage('registerMessage', '');

        if (username.length < 3) return setMessage('registerMessage', '用户名至少 3 个字符', 'error');
        if (password.length < 6) return setMessage('registerMessage', '密码至少 6 个字符', 'error');
        if (password !== passwordAgain) return setMessage('registerMessage', '两次输入的密码不一致', 'error');

        button.disabled = true;
        button.textContent = '正在创建账号…';

        try {
            const response = await fetch('/api/auth/register', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({username, password, phone, building, floor, room})
            });

            if (!response.ok) {
                throw new Error(await parseError(response, response.status === 409 ? '用户名已存在' : '注册失败'));
            }

            localStorage.setItem(SmokeAuth.SAVED_USERNAME_KEY, username);
            document.getElementById('loginUsername').value = username;
            registerForm.reset();
            setMessage('registerMessage', '注册成功，即将返回登录…', 'success');

            window.setTimeout(() => {
                setMode('login');
                setMessage('loginMessage', '账号已创建，请输入密码登录', 'success');
            }, 650);
        } catch (error) {
            setMessage('registerMessage', error.message || '注册失败', 'error');
        } finally {
            button.disabled = false;
            button.textContent = '创建居民账号';
        }
    });
</script>
</body>
</html>
