<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>烟感报警 · 摄像头复核模拟</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, "Microsoft YaHei", sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      min-height: 100vh;
      padding: 24px;
    }
    .container { max-width: 1100px; margin: 0 auto; }
    h1 { font-size: 22px; margin-bottom: 4px; }
    .sub { color: #94a3b8; font-size: 13px; margin-bottom: 20px; }
    .main { display: flex; gap: 20px; flex-wrap: wrap; }
    .panel {
      background: #1e293b;
      border-radius: 14px;
      padding: 18px;
      flex: 1;
      min-width: 320px;
    }
    .panel-title { font-size: 15px; font-weight: 600; margin-bottom: 12px; }
    video {
      width: 100%;
      border-radius: 10px;
      background: #000;
      transform: scaleX(-1); /* 镜像，像照镜子 */
      aspect-ratio: 4/3;
      object-fit: cover;
    }
    .video-status { margin-top: 8px; font-size: 13px; color: #94a3b8; }
    .btn {
      display: block;
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      cursor: pointer;
      transition: opacity .15s;
    }
    .btn:hover { opacity: .85; }
    .btn-alarm { background: #ef4444; color: #fff; margin-bottom: 8px; }
    .btn-auto { background: #334155; color: #e2e8f0; font-size: 13px; padding: 8px; }
    .btn-auto.on { background: #16a34a; }
    .alarm-card {
      margin-top: 16px;
      background: #450a0a;
      border: 1px solid #ef4444;
      border-radius: 10px;
      padding: 14px;
      display: none;
    }
    .alarm-card.show { display: block; animation: flash .6s; }
    @keyframes flash { 0% { opacity: 0; transform: scale(.96);} 100% { opacity: 1; } }
    .alarm-title { color: #fca5a5; font-weight: 700; margin-bottom: 8px; }
    .alarm-meta { font-size: 13px; color: #fecaca; margin: 4px 0; }
    .alarm-card img {
      width: 100%;
      border-radius: 8px;
      margin: 10px 0;
      border: 1px solid #7f1d1d;
    }
    .actions { display: flex; gap: 10px; }
    .actions button { flex: 1; padding: 10px; border: none; border-radius: 8px; cursor: pointer; font-size: 14px; }
    .btn-confirm { background: #dc2626; color: #fff; }
    .btn-false { background: #16a34a; color: #fff; }
    h3 { margin: 20px 0 8px; font-size: 14px; color: #cbd5e1; }
    .history { list-style: none; max-height: 260px; overflow: auto; }
    .history li {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 10px;
      background: #0f172a;
      border-radius: 8px;
      margin-bottom: 6px;
      font-size: 13px;
    }
    .history img { width: 56px; height: 42px; object-fit: cover; border-radius: 4px; }
    .tag { padding: 2px 8px; border-radius: 10px; font-size: 12px; }
    .tag-confirm { background: #dc2626; color: #fff; }
    .tag-false { background: #16a34a; color: #fff; }
  </style>
</head>
<body>
  <div class="container">
    <h1>🔥 烟感报警 · 摄像头复核模拟</h1>
    <div class="sub">用电脑摄像头模拟「现场摄像头」：报警触发 → 自动抓拍 → 人工复核闭环</div>

    <div class="main">
      <!-- 左：实时摄像头 -->
      <div class="panel">
        <div class="panel-title">📷 现场实时画面（电脑摄像头模拟）</div>
        <video id="video" autoplay playsinline muted></video>
        <div class="video-status" id="videoStatus">正在请求摄像头权限...</div>
      </div>

      <!-- 右：报警 + 复核 -->
      <div class="panel">
        <div class="panel-title">🚨 报警联动复核</div>
        <button class="btn btn-alarm" id="alarmBtn">🔔 模拟烟感报警</button>
        <button class="btn btn-auto" id="autoBtn">⏱ 开启自动报警（每8秒随机触发）</button>

        <div class="alarm-card" id="alarmCard">
          <div class="alarm-title">⚠️ 烟雾浓度告警触发</div>
          <div class="alarm-meta">浓度：<span id="smokeVal"></span> ppm（模拟烟感上报）</div>
          <div class="alarm-meta">时间：<span id="alarmTime"></span></div>
          <img id="snapshot" alt="抓拍画面">
          <div class="actions">
            <button class="btn-confirm" id="confirmBtn">✅ 确认火情</button>
            <button class="btn-false" id="falseBtn">❌ 误报</button>
          </div>
        </div>

        <h3>📋 复核记录</h3>
        <ul class="history" id="history"></ul>
      </div>
    </div>
  </div>

  <canvas id="canvas" style="display:none"></canvas>

  <script>
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const videoStatus = document.getElementById('videoStatus');
    const alarmCard = document.getElementById('alarmCard');
    const alarmBtn = document.getElementById('alarmBtn');
    const autoBtn = document.getElementById('autoBtn');
    const historyEl = document.getElementById('history');

    let autoTimer = null;

    // 1. 启动电脑摄像头
    async function startCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: true });
        video.srcObject = stream;
        videoStatus.textContent = '✅ 摄像头已连接（实时画面已镜像）';
        videoStatus.style.color = '#4ade80';
      } catch (err) {
        videoStatus.textContent = '❌ 无法访问摄像头：' + err.message + '（需在 localhost 或 https 下打开）';
        videoStatus.style.color = '#f87171';
      }
    }

    // 2. 抓拍当前画面
    function snapshot() {
      canvas.width = video.videoWidth || 640;
      canvas.height = video.videoHeight || 480;
      canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);
      return canvas.toDataURL('image/jpeg', 0.85);
    }

    // 3. 时间格式化
    function fmt(ts) {
      const d = new Date(ts);
      const p = n => String(n).padStart(2, '0');
      return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
    }

    // 4. 触发报警（抓拍 + 显示告警卡片）
    function triggerAlarm() {
      const smoke = (Math.random() * 40 + 55).toFixed(1); // 55~95，模拟>50告警
      document.getElementById('smokeVal').textContent = smoke;
      document.getElementById('alarmTime').textContent = fmt(Date.now());
      document.getElementById('snapshot').src = snapshot();
      alarmCard.classList.add('show');
    }

    // 5. 复核闭环：写记录
    function record(result, label) {
      const li = document.createElement('li');
      li.innerHTML = `
        <img src="${document.getElementById('snapshot').src}">
        <div style="flex:1">
          <div>浓度 ${document.getElementById('smokeVal').textContent} ppm</div>
          <div style="color:#94a3b8;font-size:12px">${document.getElementById('alarmTime').textContent}</div>
        </div>
        <span class="tag tag-${result}">${label}</span>`;
      historyEl.prepend(li);
      alarmCard.classList.remove('show');
    }

    // 绑定事件
    alarmBtn.addEventListener('click', triggerAlarm);
    document.getElementById('confirmBtn').addEventListener('click', () => record('confirm', '确认火情'));
    document.getElementById('falseBtn').addEventListener('click', () => record('false', '误报'));

    autoBtn.addEventListener('click', () => {
      if (autoTimer) {
        clearInterval(autoTimer); autoTimer = null;
        autoBtn.textContent = '⏱ 开启自动报警（每8秒随机触发）';
        autoBtn.classList.remove('on');
      } else {
        triggerAlarm();
        autoTimer = setInterval(triggerAlarm, 8000);
        autoBtn.textContent = '⏹ 关闭自动报警';
        autoBtn.classList.add('on');
      }
    });

    startCamera();
  </script>
</body>
</html>
