<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>智慧烟感监控</title>
    <style>
        .box{width:700px;margin:30px auto;font-size:18px;}
        .warn{color:red;font-weight:bold;}
        .normal{color:green;}
        table{width:100%;border-collapse: collapse;margin-top:20px;}
        th,td{border:1px solid #999;padding:6px;text-align:center;}
    </style>
</head>
<body>
<div class="box">
    <h2>BearPi智慧烟感监测</h2>
    <div>烟雾浓度：<span id="smokeVal">--</span></div>
    <div>蜂鸣器状态：<span id="beepVal">--</span></div>
    <div id="alertTip" class="normal">状态：正常</div>

    <h3>历史采集记录（最新20条）</h3>
    <table>
        <thead>
        <tr>
            <th>编号</th>
            <th>烟雾浓度</th>
            <th>蜂鸣器</th>
            <th>采集时间</th>
        </tr>
        </thead>
        <tbody id="historyTable">
        </tbody>
    </table>
</div>

<script>
    function fetchData(){
        fetch("/smoke")
            .then(res=>res.json())
            .then(data=>{
                document.getElementById("smokeVal").innerText = data.smokeValue;
                document.getElementById("beepVal").innerText = data.beepStatus;
                const tipDom = document.getElementById("alertTip");
                let smoke = parseFloat(data.smokeValue);
                if(smoke > 50){
                    tipDom.innerText = "⚠️烟雾超标，报警！";
                    tipDom.className = "warn";
                }else{
                    tipDom.innerText = "✅状态正常";
                    tipDom.className = "normal";
                }
            })

        fetch("/history")
            .then(res=>res.json())
            .then(list=>{
                let html = "";
                for(let item of list.slice(0,20)){
                    html +=`<tr>
                    <td>${item.id}</td>
                    <td>${item.smokeValue}</td>
                    <td>${item.beepStatus}</td>
                    <td>${item.createTime}</td>
                </tr>`;
                }
                document.getElementById("historyTable").innerHTML = html;
            })
    }

    fetchData();
    setInterval(fetchData,2000);
</script>
</body>
</html>
